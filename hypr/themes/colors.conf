# ~/.config/hypr/themes/colors.conf
# Source palette dari _colors.conf (single source of truth)

source = ~/.config/hypr/themes/_colors.conf

# Legacy aliases — dari palette
$background = $bg-solid
$foreground = $fg

# Window borders
$active_border = rgba(d5c89a44)
$inactive_border = rgba(d5c89a4b)

# Transparency
$transparent = rgba(00000000)

# Extended Catppuccin (diluar palette utama)
$accent2 = rgba(f5c2e7ff)
$black = rgba(11111bff)
$white = rgba(ffffffff)
$red = rgba(f38ba8ff)
$green = rgba(a6e3a1ff)
$yellow = rgba(f9e2afff)
$blue = rgba(89b4faff)
$purple = rgba(cba6f7ff)
$cyan = rgba(94e2d5ff)
