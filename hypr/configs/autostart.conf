# =========================
# AUTOSTART
# =========================

# Status bar
exec-once = waybar

# EWW widget daemon (preload biar popup ga nge-lag pas pertama dibuka)
exec-once = eww daemon

# Notification daemon
exec-once = swaync

# Wallpaper daemon
exec-once = hyprpaper

# Network manager tray
exec-once = nm-applet

# Bluetooth tray
exec-once = blueman-applet

# Clipboard manager
exec-once = ~/.config/hypr/scripts/clipboard-watch.sh

# Polkit authentication
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Idle daemon
exec-once = hypridle

# OSD volume & brightness → via EWW (lihat ~/.config/eww/)
# Avizo sudah tidak dipakai — EWW menggantikan dengan teks + progress bar